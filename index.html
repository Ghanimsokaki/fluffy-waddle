<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fluffy Waddle · AI Chat</title>
<style>
:root{
  --bg:#f7f7fb; --panel:#ffffff; --side:#f0f0f7; --text:#1b1b29; --muted:#6b6b80;
  --border:#e3e3ee; --accent:#7c5cff; --accent2:#ff7ab8; --user:#7c5cff; --userText:#fff;
  --bot:#ffffff; --code:#14141f; --codeText:#e8e8f5; --shadow:0 8px 30px rgba(40,30,90,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e16; --panel:#15151f; --side:#11111a; --text:#ececf6; --muted:#8d8da6;
    --border:#25253a; --bot:#1a1a27; --code:#0a0a12; --shadow:0 8px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e16; --panel:#15151f; --side:#11111a; --text:#ececf6; --muted:#8d8da6;
  --border:#25253a; --bot:#1a1a27; --code:#0a0a12; --shadow:0 8px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
aside{width:272px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px;gap:10px;transition:transform .25s}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;padding:4px 6px}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-size:18px}
.new{border:1px dashed var(--border);background:var(--panel);border-radius:12px;padding:10px;text-align:left;font-weight:600;transition:.15s}
.new:hover{border-color:var(--accent);color:var(--accent)}
#chats{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.chat{display:flex;align-items:center;gap:6px;border:0;background:none;border-radius:10px;padding:8px 10px;text-align:left}
.chat span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat:hover{background:var(--panel)}
.chat.active{background:var(--panel);box-shadow:inset 3px 0 0 var(--accent)}
.chat .del{opacity:0;color:var(--muted);padding:0 4px}
.chat:hover .del{opacity:1}
.foot{display:flex;gap:8px}
.ghost{flex:1;border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:8px}
.ghost:hover{border-color:var(--accent)}
main{flex:1;display:flex;flex-direction:column;min-width:0;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--panel)}
#menu{display:none;border:0;background:none;font-size:22px}
header h1{font-size:15px;margin:0;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:2px 10px}
#feed{flex:1;overflow:auto;padding:24px 18px;scroll-behavior:smooth}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px;animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.av{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;font-size:16px;background:var(--side);border:1px solid var(--border)}
.msg.bot .av{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0}
.bubble{padding:11px 15px;border-radius:16px;background:var(--bot);border:1px solid var(--border);max-width:calc(100% - 44px);overflow-wrap:anywhere;box-shadow:var(--shadow)}
.msg.user{flex-direction:row-reverse}
.msg.user .bubble{background:var(--user);color:var(--userText);border:0}
.bubble p{margin:0 0 .6em}.bubble p:last-child{margin:0}
.bubble code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em;background:rgba(124,92,255,.14);padding:1px 6px;border-radius:6px}
.msg.user .bubble code{background:rgba(255,255,255,.22)}
pre{position:relative;background:var(--code);color:var(--codeText);border-radius:12px;padding:14px;overflow-x:auto;margin:.6em 0}
pre code{background:none!important;padding:0;color:inherit}
pre button{position:absolute;top:8px;right:8px;font-size:12px;border:1px solid #ffffff30;background:#ffffff14;color:#fff;border-radius:8px;padding:2px 8px}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px);opacity:.4}}
.empty{margin:auto;text-align:center;padding:40px 10px}
.empty .logo{width:64px;height:64px;font-size:34px;border-radius:20px;margin:0 auto 14px}
.empty h2{margin:0 0 6px;font-size:24px}.empty p{color:var(--muted);margin:0 0 20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{border:1px solid var(--border);background:var(--panel);border-radius:99px;padding:8px 14px}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
form{padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.box{max-width:780px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:8px 8px 8px 16px;box-shadow:var(--shadow);transition:.15s}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:inherit;font:inherit;max-height:180px;padding:6px 0}
#send{width:38px;height:38px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:18px}
#send:disabled{opacity:.45;cursor:not-allowed}
.hint{max-width:780px;margin:6px auto 0;text-align:center;font-size:12px;color:var(--muted)}
dialog{border:1px solid var(--border);border-radius:18px;background:var(--panel);color:var(--text);padding:22px;width:min(420px,92vw);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,10,20,.5);backdrop-filter:blur(3px)}
dialog h3{margin:0 0 4px}dialog p{color:var(--muted);margin:0 0 14px;font-size:13px}
label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px;color:var(--muted)}
input{width:100%;border:1px solid var(--border);background:var(--bg);color:inherit;border-radius:10px;padding:9px 11px;font:inherit}
input:focus{outline:2px solid var(--accent);border-color:transparent}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.primary{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 16px;font-weight:600}
@media (max-width:760px){
  aside{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);box-shadow:var(--shadow)}
  aside.open{transform:none}
  #menu{display:block}
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><div class="logo">🧇</div>Fluffy Waddle</div>
  <button class="new" id="new">＋ New chat</button>
  <div id="chats"></div>
  <div class="foot">
    <button class="ghost" id="theme" title="Toggle theme">◐ Theme</button>
    <button class="ghost" id="settings">⚙ Settings</button>
  </div>
</aside>
<main>
  <header>
    <button id="menu" aria-label="Menu">☰</button>
    <h1 id="title">New chat</h1>
    <span class="pill" id="mode">demo mode</span>
  </header>
  <div id="feed"><div class="wrap" id="wrap"></div></div>
  <form id="form">
    <div class="box">
      <textarea id="input" rows="1" placeholder="Message Fluffy Waddle…" autofocus></textarea>
      <button id="send" type="submit" aria-label="Send">↑</button>
    </div>
    <div class="hint">Enter to send · Shift+Enter for a new line</div>
  </form>
</main>

<dialog id="dlg">
  <h3>Settings</h3>
  <p>Connect any OpenAI-compatible chat endpoint. Leave empty to use demo mode. Saved only in this browser.</p>
  <label>Endpoint URL</label><input id="s-url" placeholder="https://your-host/v1/chat/completions">
  <label>Model</label><input id="s-model" placeholder="model-name">
  <label>API key</label><input id="s-key" type="password" placeholder="optional">
  <div class="row">
    <button class="ghost" id="s-cancel" style="flex:none">Cancel</button>
    <button class="primary" id="s-save">Save</button>
  </div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};
let chats=store.get('fw.chats',[]), cur=store.get('fw.cur',null), cfg=store.get('fw.cfg',{url:'',model:'',key:''});
let busy=false;
const uid=()=>Math.random().toString(36).slice(2,9);
const active=()=>chats.find(c=>c.id===cur);
const save=()=>{store.set('fw.chats',chats);store.set('fw.cur',cur)};

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(t){
  const parts=t.split(/```/);
  return parts.map((p,i)=>{
    if(i%2){const nl=p.indexOf('\n');const body=nl>-1?p.slice(nl+1):p;return `<pre><button data-copy>Copy</button><code>${esc(body.replace(/\n$/,''))}</code></pre>`}
    return esc(p).split(/\n{2,}/).filter(Boolean).map(x=>'<p>'+x
      .replace(/`([^`]+)`/g,'<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
      .replace(/\n/g,'<br>')+'</p>').join('');
  }).join('');
}

function renderList(){
  $('chats').innerHTML='';
  chats.forEach(c=>{
    const b=document.createElement('button');
    b.className='chat'+(c.id===cur?' active':'');
    b.innerHTML=`<span>${esc(c.title)}</span><i class="del" data-del="${c.id}">✕</i>`;
    b.onclick=e=>{
      if(e.target.dataset.del){chats=chats.filter(x=>x.id!==c.id);if(cur===c.id)cur=chats[0]?.id||null;save();renderAll();return}
      cur=c.id;save();renderAll();$('side').classList.remove('open');
    };
    $('chats').appendChild(b);
  });
}
function bubble(role,html){
  const d=document.createElement('div');d.className='msg '+role;
  d.innerHTML=`<div class="av">${role==='bot'?'🧇':'🙂'}</div><div class="bubble">${html}</div>`;
  $('wrap').appendChild(d);scroll();return d.querySelector('.bubble');
}
const scroll=()=>{$('feed').scrollTop=$('feed').scrollHeight};
function renderChat(){
  const c=active();$('wrap').innerHTML='';
  $('title').textContent=c?c.title:'New chat';
  if(!c||!c.msgs.length){
    $('wrap').innerHTML=`<div class="empty"><div class="logo">🧇</div><h2>What can I help with?</h2><p>Ask anything, or try one of these.</p>
    <div class="chips">${['Explain how neural networks learn','Write a Python function to sort a list','Give me 5 project ideas'].map(x=>`<button data-chip="${x}">${x}</button>`).join('')}</div></div>`;
    return;
  }
  c.msgs.forEach(m=>bubble(m.role==='user'?'user':'bot',md(m.content)));
}
function renderAll(){renderList();renderChat();$('mode').textContent=cfg.url?(cfg.model||'live'):'demo mode'}

async function reply(msgs){
  if(!cfg.url){
    await new Promise(r=>setTimeout(r,700));
    return 'This is **demo mode**. Open ⚙ Settings and add an OpenAI-compatible endpoint to talk to a real model.\n\nYou said: `'+msgs[msgs.length-1].content.slice(0,120)+'`';
  }
  const r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'application/json',...(cfg.key?{Authorization:'Bearer '+cfg.key}:{})},
    body:JSON.stringify({model:cfg.model,messages:msgs})});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,200));
  const j=await r.json();
  return j.choices?.[0]?.message?.content??JSON.stringify(j);
}
async function send(text){
  if(busy||!text.trim())return;
  if(!active()){const c={id:uid(),title:'New chat',msgs:[]};chats.unshift(c);cur=c.id}
  const c=active();
  if(!c.msgs.length)c.title=text.trim().slice(0,40);
  c.msgs.push({role:'user',content:text.trim()});save();
  busy=true;$('send').disabled=true;renderAll();
  const b=bubble('bot','<span class="dots"><i></i><i></i><i></i></span>');
  try{
    const out=await reply(c.msgs);
    c.msgs.push({role:'assistant',content:out});b.innerHTML=md(out);
  }catch(e){b.innerHTML='⚠️ '+esc(String(e.message||e))}
  busy=false;$('send').disabled=false;save();renderList();scroll();
}

$('form').onsubmit=e=>{e.preventDefault();const t=$('input').value;$('input').value='';fit();send(t)};
$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};
const fit=()=>{const i=$('input');i.style.height='auto';i.style.height=Math.min(i.scrollHeight,180)+'px'};
$('input').oninput=fit;
$('new').onclick=()=>{cur=null;save();renderAll();$('input').focus();$('side').classList.remove('open')};
$('menu').onclick=()=>$('side').classList.toggle('open');
document.addEventListener('click',e=>{
  const chip=e.target.closest('[data-chip]');if(chip)send(chip.dataset.chip);
  const cp=e.target.closest('[data-copy]');
  if(cp){navigator.clipboard?.writeText(cp.nextElementSibling.textContent);cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy',1200)}
});
$('theme').onclick=()=>{
  const root=document.documentElement;
  const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme=dark?'light':'dark';store.set('fw.theme',root.dataset.theme);
};
const th=store.get('fw.theme',null);if(th)document.documentElement.dataset.theme=th;
$('settings').onclick=()=>{$('s-url').value=cfg.url;$('s-model').value=cfg.model;$('s-key').value=cfg.key;$('dlg').showModal()};
$('s-cancel').onclick=()=>$('dlg').close();
$('s-save').onclick=()=>{cfg={url:$('s-url').value.trim(),model:$('s-model').value.trim(),key:$('s-key').value.trim()};store.set('fw.cfg',cfg);$('dlg').close();renderAll()};
renderAll();
</script>
</body>
</html>
